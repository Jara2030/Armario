# Compila Armario para todas las plataformas, GRATIS (repo público):
#   - Android  -> APK
#   - Windows  -> .zip con la app de escritorio
#   - iPhone   -> .ipa SIN firmar (para Sideloadly / SideStore)
#   - Web/PWA  -> publicada en GitHub Pages
# Los archivos quedan en la pestaña "Releases" del repo (versión "latest").
#
# Secretos opcionales (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  firma estable del APK (ver README)
#   SUPABASE_URL, SUPABASE_ANON_KEY  para que la app venga ya configurada
#     (si no, se escriben una vez en Ajustes dentro de la app)

name: Compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  DEFINES: >-
    --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Clave de firma (si está configurada)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/armario.jks
            echo "APK firmado con tu clave estable."
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: el APK se firma con una clave temporal y para actualizar habrá que desinstalar la versión anterior (ver README)."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }} ${{ env.DEFINES }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk armario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: armario.apk

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }} ${{ env.DEFINES }}
      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath armario-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: armario-windows.zip

  ios:
    name: iPhone (.ipa sin firmar)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} ${{ env.DEFINES }}
      - name: Empaquetar .ipa sin firmar
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr armario-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: armario-sin-firmar.ipa

  web:
    name: Web / PWA
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --build-number=${{ github.run_number }} ${{ env.DEFINES }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Publicar PWA en GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publicar descargas
    needs: [android, windows, ios]
    # Publica lo que haya salido bien aunque falle alguna plataforma.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: app-*
          merge-multiple: true
      - name: Actualizar la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out || exit 0
          if [ -z "$(ls -A out 2>/dev/null)" ]; then echo "Nada que publicar"; exit 0; fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* \
            --target "${{ github.sha }}" \
            --title "Armario · compilación ${{ github.run_number }}" \
            --notes "Compilación automática del commit ${{ github.sha }}. Instrucciones de instalación en el README."
